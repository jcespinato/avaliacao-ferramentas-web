<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de contato do projeto acadêmico JC Tech.">
  <title>JC Tech | Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container topo">
      <h1>JC Tech</h1>
      <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a class="ativo" href="contato.html">Contato</a>
      </nav>
    </div>
  </header>

  <main class="container secao">
    <p class="destaque">Fale conosco</p>
    <h2>Contato</h2>
    <p>Formulário demonstrativo para praticar campos HTML. Ele não envia dados para um servidor.</p>

    <form action="#" method="get" class="formulario">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="6" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>Desenvolvido para fins acadêmicos por João Carlos de Souza Espinato.</p>
    </div>
  </footer>
</body>
</html>
